name: Muyu single Android14 6.1.138 / SYSVIPC 678 experiment
permissions:
  contents: read
  actions: read
jobs:
  resolve-version:
    runs-on: ubuntu-24.04
    outputs:
      android_version: ${{ steps.resolve.outputs.android_version }}
      sub_level: ${{ steps.resolve.outputs.sub_level }}
      kernel_full: ${{ steps.resolve.outputs.kernel_full }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Resolve and strictly validate the one authorized parameter set
      id: resolve
      env:
        RAW_INPUTS: ${{ toJSON(inputs) }}
      run: |
        python3 <<'PY'
        import json,os
        from pathlib import Path
        expected={'kernel_version': '6.1', 'os_patch_level': '2025-06', 'droidspaces': '678', 'droidspaces_ntsync': False, 'kernelsu_variant': 'Official', 'ksu_mode': '禁用SUSFS', 'use_zram': False, 'use_bbg': False, 'use_rekernel': False, 'use_nomount': False, 'use_networking': False, 'cve_2026_43499_patch': False, 'artifact_upload_mode': '仅上传 AnyKernel3.zip', 'use_kpm': 'disabled (关闭)', 'supp_op': False, 'version': '', 'build_time': ''}
        actual=expected | (json.loads(os.environ.get('RAW_INPUTS') or '{}') or {})
        assert actual==expected, f'Only the authorized muyu parameter set is allowed: {actual}'
        data=json.loads(Path('data/android14/6.1.json').read_text())
        entry=next(x for x in data['entries'] if x['date']=='2025-06')
        assert entry['kernel']=='6.1.138',entry
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:
         f.write('android_version=android14\nsub_level=138\nkernel_full=6.1.138\n')
        print(json.dumps({'resolved':'android14 / 6.1.138','parameters':actual},ensure_ascii=False,indent=2))
        PY
    if: 'github.event_name == ''workflow_dispatch'' || github.event.head_commit.message == ''muyu678: OEM public trust and truthful Official metadata experiment 20261116'''
  build-custom-kernel:
    name: ${{ needs.resolve-version.outputs.kernel_full }}-${{ needs.resolve-version.outputs.android_version }}-${{ inputs.os_patch_level }}
    needs: resolve-version
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: android14
      kernel_version: '6.1'
      sub_level: '138'
      os_patch_level: 2025-06
      revision: r1
      ksu_variant: Official
      ksu_mode: 禁用SUSFS
      version: ''
      build_time: ''
      use_kpm: disabled (关闭)
      enable_susfs: false
      artifact_upload_mode: 仅上传 AnyKernel3.zip
      droidspaces: '678'
      muyu_678_experiment: true
      use_zram: false
      use_bbg: false
      use_rekernel: false
      use_nomount: false
      use_networking: false
      cve_2026_43499_patch: false
      supp_op: false
      droidspaces_ntsync: false
'on':
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 内核版本
        required: true
        type: choice
        options:
        - '5.10'
        - '5.15'
        - '6.1'
        - '6.6'
        - '6.12'
        default: '6.1'
      kernelsu_variant:
        description: KernelSU 变体
        required: true
        type: choice
        options:
        - Official
        - SukiSU
        - SukiSU(40726)
        - SukiSU(40548)
        - BakaSU
        default: Official
      ksu_mode:
        description: KernelSU / SUSFS 模式
        required: true
        type: choice
        options:
        - 关闭
        - 禁用SUSFS
        - 禁用KSU
        default: 禁用SUSFS
      use_kpm:
        description: KPM 功能（patched 尚不支持）
        required: true
        type: choice
        default: disabled (关闭)
        options:
        - disabled (关闭)
        - enabled (开启)
        - patched (开启并修补，尚不支持)
      droidspaces:
        description: 'Droidspaces 容器支持 (5.10~6.6: 槽位补丁, 6.12: 开/关)'
        required: false
        type: choice
        options:
        - 'off'
        - '678'
        - '123'
        - '345'
        default: '678'
      artifact_upload_mode:
        description: 构建产物上传模式
        required: true
        type: choice
        options:
        - 仅上传 AnyKernel3.zip
        - 上传全部
        default: 仅上传 AnyKernel3.zip
      os_patch_level:
        description: 安全补丁级别 (如 2022-01, lts)
        required: true
        type: string
        default: 2025-06
      version:
        description: 自定义版本名 (可选)
        required: false
        type: string
        default: ''
      build_time:
        description: 自定义构建时间 (可选，N或留空=当前UTC)
        required: false
        type: string
        default: ''
      use_zram:
        description: 启用 ZRAM 增强算法
        required: true
        type: boolean
        default: false
      use_bbg:
        description: 启用 BBG 防格机
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: 启用 Re-Kernel 驱动
        required: false
        type: boolean
        default: false
      use_nomount:
        description: 启用 NoMount 挂载元模块
        required: false
        type: boolean
        default: false
      use_networking:
        description: 启用网络增强（BBRv3 / IPSet / Qdisc / CIFS）
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: 应用 CVE-2026-43499 rtmutex 修复链
        required: false
        type: boolean
        default: false
      supp_op:
        description: 启用一加 8E 支持
        required: false
        type: boolean
        default: false
      droidspaces_ntsync:
        description: 启用 Droidspaces 容器 NTSync 支持（需启用 Droidspaces）
        required: false
        type: boolean
        default: false
  push:
    branches:
    - dev
    paths:
    - .github/workflows/kernel-custom.yml
concurrency:
  group: muyu-678-${{ github.ref }}
  cancel-in-progress: false
