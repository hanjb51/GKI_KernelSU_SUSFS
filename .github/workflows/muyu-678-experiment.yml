    - name: Package only AnyKernel3 ZIP; never execute installation or create a Release
      if: steps.compile.outcome == 'success' && steps.collect.outcome == 'success'
      shell: bash
      run: |
        set -euo pipefail
        test -f "$EVID/config-from-Image-verified.txt"
        cp "$EVID/dist/Image" "$GITHUB_WORKSPACE/AnyKernel3/Image"
        python3 <<'PY'
        from pathlib import Path
        import os,zipfile,hashlib
        root=Path(os.environ['GITHUB_WORKSPACE']);ak=root/'AnyKernel3';dst=root/'release/AnyKernel3-muyu-6.1.138-Official-678.zip'
        (ak/'CANDIDATE-NOT-ACCEPTED.txt').write_text('Experimental muyu SYSVIPC 678 candidate. Compilation is not OEM module compatibility acceptance. No flashing performed. Review evidence first.\n')
        with zipfile.ZipFile(dst,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
         for p in sorted(ak.rglob('*')):
          if p.is_file() and '.git' not in p.relative_to(ak).parts:z.write(p,p.relative_to(ak).as_posix())
        (Path(os.environ['EVID'])/'AnyKernel3.sha256').write_text(hashlib.sha256(dst.read_bytes()).hexdigest()+'  '+dst.name+'\n')
        print(dst.name,hashlib.sha256(dst.read_bytes()).hexdigest())
        PY
    - name: Seal all non-private audit evidence
      if: always()
      shell: bash
      run: |
        python3 <<'PY'
        from pathlib import Path
        import os,hashlib
        r=Path(os.environ['EVID']);lines=[]
        for p in sorted(r.rglob('*')):
         if not p.is_file() or p.name=='SHA256SUMS' or 'dist' in p.relative_to(r).parts or 'abi-dist' in p.relative_to(r).parts:continue
         if p.name.endswith('.key') or p.name=='signing_key.pem':raise RuntimeError('Unexpected private key in evidence')
         lines.append(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.relative_to(r).as_posix())
        (r/'SHA256SUMS').write_text('\n'.join(lines)+'\n')
        PY
    - name: Upload the requested AnyKernel3 ZIP only
      if: always() && steps.compile.outcome == 'success' && steps.collect.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: AnyKernel3-muyu-6.1.138-Official-678-${{ github.run_id }}
        path: release/*.zip
        if-no-files-found: error
        retention-days: 30
    - name: Preserve required config, manifest, hashes, rejects and compilation/ABI logs on all outcomes
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: Evidence-muyu-6.1.138-678-${{ github.run_id }}
        path: |-
          evidence/
          !evidence/dist/
          !evidence/abi-dist/
          !evidence/**/*signing_key.pem
          !evidence/**/*.key
        if-no-files-found: error
        retention-days: 30
    - name: Report compilation and ABI enforcement failures separately
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        cat "$EVID/result.json" 2>/dev/null || true
        test -f "$EVID/compile-exit-code.txt"
        test "$(cat "$EVID/compile-exit-code.txt")" = 0
        test -f "$EVID/upstream-abi-exit-code.txt"
        test "$(cat "$EVID/upstream-abi-exit-code.txt")" = 0
        test -f "$EVID/config-from-Image-verified.txt"
